[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcaf-idaholab"
version = "0.2.0"
description = "Discounted Cashflow Analysis Framework is a financial engineering library for nuclear energy projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Dylan J. McDowell"},
    {name = "Jacob A Bryan"},
    {name = "Caleb M Sitton"},
    {name = "Gabriel J Soto Gonzalez"},
    {name = "Nahuel Guaita"},
    {name = "Paul W Talbot"},
]
maintainers = [
    {name = "Idaho National Laboratory"},
]
keywords = [
    "discounted cash flow",
    "financial engineering",
    "nuclear energy",
    "techno-economic analysis",
    "extended power uprate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "types-python-dateutil>=2.9.0.20260302",
]

[project.urls]
Homepage = "https://github.com/IdahoLabResearch/DCAF"
Documentation = "https://github.com/IdahoLabResearch/DCAF/tree/main/docs"
Repository = "https://github.com/IdahoLabResearch/DCAF.git"
Issues = "https://github.com/IdahoLabResearch/DCAF/issues"

[tool.hatch.build.targets.wheel]
packages = ["dcaf"]


[dependency-groups]
all = [
    {include-group = "dev"},
    {include-group = "docs"},
    {include-group = "tests"},
]

dev = [
    "mypy>=1.8.0",
    "pre-commit>=4.2.0",
    "ruff>=0.2.0",
]

docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.2.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-book-theme>=1.0.0",
]

tests = [
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[pytest]
doctest_optionflags = ["ELLIPSIS"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
