[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcaf"
version = "0.1.0"
description = "Discounted Cashflow Analysis Framework is a financial engineering library for nuclear energy projects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "types-python-dateutil>=2.9.0.20260302",
]


[dependency-groups]
all = [
    {include-group = "dev"},
    {include-group = "docs"},
    {include-group = "tests"},
]

dev = [
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.2.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

tests = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",    
]

[tool.uv]
default-groups = "all"

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
