name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit -n auto

      - name: Run integration tests (documented example outputs)
        run: uv run pytest tests/test_documented_outputs.py

      - name: Run docstring tests
        run: uv run pytest dcaf

      - name: Run examples
        run: |
          for example in examples/*.py; do
            echo "::group::$example"
            uv run python "$example"
            echo "::endgroup::"
          done
